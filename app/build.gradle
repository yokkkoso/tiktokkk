plugins {
    id 'com.android.application'
}

android {
    namespace 'me.yokkkoso.tiktokkk'
    compileSdk 34

    defaultConfig {
        applicationId 'me.yokkkoso.tiktokkk'
        minSdk 24
        targetSdk 34
        versionCode 8
        versionName '1.3.0'

        // DexKit ships native libs for 4 ABIs; only these two exist on real devices.
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
    }

    // LSPatch loads module .so straight out of the APK ("<apk>!/lib/<abi>"), which requires
    // them stored uncompressed. minSdk 24 already defaults to that - keep it explicit.
    packagingOptions { jniLibs { useLegacyPackaging false } }

    buildTypes {
        debug {
            debuggable false
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
    compileOnly 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.luckypray:dexkit:2.2.0'
}
